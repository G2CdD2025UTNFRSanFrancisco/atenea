server.port=8080
spring.application.name=atenea

spring.datasource.url=jdbc:postgresql://localhost:5432/estacionamiento-v2
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=AteneaPool

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=50

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.jackson.time-zone=UTC

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

spring.jackson.property-naming-strategy=SNAKE_CASE

atenea.security.refresh-token.hmac-secret=super-secret-key
atenea.security.secret.hmac-secret=change-me-atenea-hmac-secret-32bytes-min
atenea.security.secret.aes-secret=atenea-aes-secret-key-32-bytes!!

atenea.rabbitmq.spot-status.exchange=atenea.spot.events
atenea.rabbitmq.spot-status.queue=atenea.spot.status.updated
atenea.rabbitmq.spot-status.routing-key=spot.status.updated

atenea.websocket.endpoint=/ws
atenea.websocket.topic-prefix=/topic
atenea.websocket.app-prefix=/app
atenea.websocket.destination.spot-status=/topic/spots/status

# CORS Configuration (profile-specific, see application-dev.properties and application-prod.properties)
atenea.cors.allowed-origins=http://localhost:5500,http://localhost:5173
atenea.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
atenea.cors.allowed-headers=*
atenea.cors.max-age=3600
atenea.cors.allow-credentials=true
