info:
  name: Activate TOTP Enrollment
  type: http
  seq: 5

http:
  method: POST
  url: "{{BASE_URL}}/mfa/totp/activation"
  headers:
    - name: Authorization
      value: Bearer {{AccessToken}}
  body:
    type: json
    data: |-
      {
        "totp_code": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
