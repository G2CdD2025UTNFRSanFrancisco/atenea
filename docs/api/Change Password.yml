info:
  name: Change Password
  type: http
  seq: 3

http:
  method: PUT
  url: "{{BASE_URL}}/accounts/password"
  headers:
    - name: X-Device-Id
      value: "{{DEVICE_ID}}"
  body:
    type: json
    data: |-
      {
        "new_password": {{process.env.PASSWORD}}
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Password-reset token is consumed from the secure cookie jar.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
