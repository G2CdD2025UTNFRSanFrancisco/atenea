info:
  name: Change Password
  type: http
  seq: 3

http:
  method: PUT
  url: "{{BASE_URL}}/accounts/password"
  headers:
    - name: X-Password-Token
      value: Bearer {{PasswordChangeToken}}
  body:
    type: json
    data: |-
      {
        "new_password": {{process.env.PASSWORD}}
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
