info:
  name: Complete MFA Session
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/sessions/mfa"
  headers:
    - name: X-Device-Id
      value: "{{DEVICE_ID}}"
  body:
    type: json
    data: |-
      {
        "totp_code": "{{TOTP_CODE}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body["status"] === "SUCCESS") {
          bru.setVar("AccessToken", res.body["access_token"]);
        }

        if (res.body["status"] === "PASSWORD_CHANGE_REQUIRED") {
          // The password-reset transition is persisted and delivered through the secure cookie jar.
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

